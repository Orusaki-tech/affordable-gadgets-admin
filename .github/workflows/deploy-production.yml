name: Deploy admin production (DISABLED - Vercel handles shop deploys)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA already in Artifact Registry (default: production-latest)'
        required: false
        default: 'production-latest'

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Skip deployment
        run: |
          echo "This workflow is disabled. The shop is deployed via Vercel on push to main."
          echo "No action needed."
